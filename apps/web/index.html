<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0814">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>OVERBOOM</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --cyan: #3de8ff; --orange: #ff7a1a; --yellow: #ffd23f; --magenta: #ff3df0; --red: #ff3d6a; --ink: #07040e; --panel: rgba(26, 18, 48, 0.88); }
  html, body { margin: 0; height: 100%; background: #0b0814; overflow: hidden; overscroll-behavior: none; }
  body { font-family: 'Silkscreen', monospace; color: #f4ecff; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #game { position: fixed; inset: 0; touch-action: none; }
  #game canvas { display: block; width: 100%; height: 100%; }
  .ob-hud { position: absolute; inset: 0; pointer-events: none; }
  .ob-hud button { pointer-events: auto; font-family: inherit; }
  .ob-left { position: absolute; left: max(14px, env(safe-area-inset-left)); top: max(12px, env(safe-area-inset-top)); display: flex; flex-direction: column; gap: 8px; }
  .ob-title { display: flex; align-items: baseline; gap: 2px; text-shadow: 0 3px 0 var(--ink); }
  .ob-title b { font-size: 22px; font-weight: 700; color: #f4ecff; }
  .ob-title b.boom { color: var(--yellow); text-shadow: 0 3px 0 #c2410c, 0 6px 0 var(--ink); }
  .ob-title span { margin-left: 10px; font-size: 10px; color: #c9bfe8; text-transform: uppercase; }
  .ob-top-right { position: absolute; right: max(14px, env(safe-area-inset-right)); top: max(12px, env(safe-area-inset-top)); display: flex; align-items: center; gap: 10px; }
  .ob-fps { font-size: 10px; color: #c9bfe8; text-shadow: 0 2px 0 var(--ink); }
  .ob-btn { width: 44px; height: 44px; border: 3px solid var(--ink); background: var(--panel); color: #f4ecff; font-size: 18px; box-shadow: 0 0 0 3px #3b2b66; cursor: pointer; }
  .ob-hp { position: relative; width: 168px; height: 18px; background: #2a1f45; border: 3px solid var(--ink); box-shadow: 0 0 0 2px #3b2b66; }
  .ob-hp-fill { position: absolute; inset: 0 auto 0 0; width: 100%; background: linear-gradient(#ff7a9a 0 30%, #ff3d6a 30% 75%, #c2284e 75%); transition: width 0.15s steps(6); }
  .ob-hp-fill.low { animation: ob-blink 0.5s steps(2) infinite; }
  .ob-hp-txt { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 10px; text-shadow: 0 2px 0 var(--ink); }
  .ob-gems { display: flex; align-items: center; gap: 6px; font-size: 16px; color: #a8f6ff; text-shadow: 0 2px 0 var(--ink); transform-origin: left center; }
  .ob-wave { position: absolute; left: 50%; top: max(10px, env(safe-area-inset-top)); transform: translateX(-50%); text-align: center; text-shadow: 0 3px 0 var(--ink); }
  .ob-wave-n { font-size: 11px; color: #c9bfe8; text-transform: uppercase; }
  .ob-wave-t { font-size: 26px; font-weight: 700; color: #f4ecff; }
  .ob-wave-t.urgent { color: var(--yellow); animation: ob-blink 0.5s steps(2) infinite; }
  .ob-banner { position: absolute; left: 50%; top: 34%; transform: translate(-50%, -50%); opacity: 0; text-align: center; white-space: nowrap; }
  .ob-banner b { display: block; font-size: clamp(28px, 7vw, 52px); font-weight: 700; text-transform: uppercase; color: var(--yellow); text-shadow: 0 4px 0 #c2410c, 0 8px 0 var(--ink); }
  .ob-banner b.cyan { color: var(--cyan); text-shadow: 0 4px 0 #1a6a8a, 0 8px 0 var(--ink); }
  .ob-banner b.rot { color: var(--red); text-shadow: 0 4px 0 #7a1030, 0 8px 0 var(--ink); }
  .ob-banner span { display: block; margin-top: 6px; font-size: 12px; text-transform: uppercase; color: #f4ecff; text-shadow: 0 2px 0 var(--ink); }
  .ob-chain { position: absolute; left: 50%; top: 17%; opacity: 0; font-size: 26px; font-weight: 700; color: var(--magenta); white-space: nowrap; text-shadow: 0 3px 0 #6a1068, 0 6px 0 var(--ink); transform-origin: center; }
  .ob-hurt { position: absolute; inset: 0; opacity: 0; background: radial-gradient(ellipse at center, transparent 45%, rgba(255, 30, 70, 0.75)); }
  .ob-dmg-layer { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .ob-dmg { position: absolute; left: 0; top: 0; font-size: 13px; font-weight: 700; color: #fff; text-shadow: 2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 2px 0 var(--ink), 0 -2px 0 var(--ink); will-change: transform; }
  .ob-dmg.big { font-size: 16px; color: #ffe28a; }
  .ob-dmg.crit { font-size: 19px; color: var(--yellow); text-shadow: 2px 0 0 #c2410c, -2px 0 0 #c2410c, 0 2px 0 #c2410c, 0 -2px 0 #c2410c, 0 4px 0 var(--ink); }
  .ob-over { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(11, 8, 20, 0.62); pointer-events: auto; }
  .ob-over.hidden { display: none; }
  .ob-over-panel { width: min(360px, 100%); padding: 18px 20px; box-sizing: border-box; text-align: center; background: var(--panel); border: 3px solid #3b2b66; box-shadow: 0 0 0 3px var(--ink), 8px 8px 0 var(--ink); transform: rotate(-1.5deg); }
  .ob-over h2 { margin: 0; font-size: 40px; color: var(--orange); text-shadow: 0 4px 0 #7a2a08, 0 7px 0 var(--ink); }
  .ob-over-quote { margin: 10px 0 14px; font-size: 11px; line-height: 1.5; color: #c9bfe8; }
  .ob-over-stats { display: grid; grid-template-columns: 1fr auto; gap: 6px 16px; margin: 0 0 16px; font-size: 12px; text-transform: uppercase; text-align: left; }
  .ob-over-stats dd { margin: 0; color: var(--yellow); text-align: right; }
  .ob-again { min-width: 180px; min-height: 48px; padding: 0 18px; border: 3px solid var(--ink); background: var(--yellow); color: var(--ink); font-size: 18px; font-weight: 700; text-transform: uppercase; box-shadow: 0 5px 0 #c2410c, 0 5px 0 3px var(--ink); cursor: pointer; }
  .ob-again:active { transform: translateY(3px); box-shadow: 0 2px 0 #c2410c, 0 2px 0 3px var(--ink); }
  .ob-over-keys { margin: 10px 0 0; font-size: 9px; color: #8a80a8; text-transform: uppercase; }
  @keyframes ob-blink { 50% { opacity: 0.45; } }
  .ob-hint { position: absolute; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); transform: translateX(-50%); padding: 8px 14px; max-width: 80vw; box-sizing: border-box; text-align: center; line-height: 1.5; background: var(--panel); border: 3px solid #3b2b66; box-shadow: 0 0 0 3px var(--ink); font-size: 11px; text-transform: uppercase; transition: opacity 0.6s; }
  .ob-hint b { color: var(--yellow); font-weight: 400; }
  .ob-hint.gone { opacity: 0; }
  .ob-dash { position: absolute; right: max(28px, env(safe-area-inset-right)); bottom: max(28px, env(safe-area-inset-bottom)); width: 96px; height: 96px; border-radius: 50%; border: none; padding: 0; cursor: pointer; color: #a8f6ff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 10px; text-transform: uppercase; background: radial-gradient(circle, rgba(26,18,48,0.9) 0 58%, transparent 59%), conic-gradient(var(--cyan) calc(var(--cd, 100) * 1%), #2a1f45 0); box-shadow: 0 0 0 3px var(--ink); touch-action: none; }
  .ob-dash.ready { box-shadow: 0 0 0 3px var(--ink), 0 0 18px 2px rgba(61,232,255,0.55); }
  .ob-dash.down { transform: scale(0.92); }
  .ob-dash.desktop { width: 72px; height: 72px; opacity: 0.85; }
  .ob-stick { position: absolute; left: 0; top: 0; width: 132px; height: 132px; margin: -66px 0 0 -66px; border-radius: 50%; border: 4px solid rgba(244,236,255,0.35); background: rgba(11,8,20,0.3); box-sizing: border-box; opacity: 0; pointer-events: none; transition: opacity 0.12s; }
  .ob-stick.on { opacity: 1; }
  .ob-knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; border-radius: 50%; background: rgba(61,232,255,0.35); border: 4px solid var(--cyan); box-sizing: border-box; transform: translate(-50%, -50%); }
  .ob-error { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center; font-size: 14px; line-height: 1.5; }
  @media (orientation: portrait) and (max-width: 600px) { .ob-title span { display: none; } .ob-hint { bottom: 140px; } }
  @media (max-height: 420px) { .ob-title { display: none; } .ob-hp { width: 132px; } .ob-wave-t { font-size: 20px; } .ob-hint { bottom: 10px; max-width: 50vw; } }
</style>
</head>
<body>
  <div id="game"></div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
