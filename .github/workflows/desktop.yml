# Desktop-Apps (Tauri) aus demselben Web-Code bauen.
# Ergebnisse liegen als Artefakte am Workflow-Lauf; release.yml macht daraus das Release.
name: Desktop-Apps

on:
  workflow_dispatch:
  # von release.yml aufgerufen (jeder Push auf main)
  workflow_call:
  push:
    branches: [claude/laughing-ramanujan-oyc23t]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop.yml'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: ''
            rust-targets: ''
            bundles: |
              apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
              apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          - name: Mac
            os: macos-latest
            # eine App für Apple Silicon und Intel
            args: '--target universal-apple-darwin'
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
            bundles: |
              apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: Linux
            os: ubuntu-22.04
            args: ''
            rust-targets: ''
            bundles: |
              apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
              apps/desktop/src-tauri/target/release/bundle/deb/*.deb
              apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Linux-Systembibliotheken (WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev

      - name: Abhängigkeiten
        run: npm ci

      - name: Tests
        run: npm test

      - name: Desktop-App bauen
        run: npm run build:desktop -- ${{ matrix.args }}

      - name: Ergebnis hochladen
        uses: actions/upload-artifact@v5
        with:
          name: OVERBOOM-${{ matrix.name }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error
