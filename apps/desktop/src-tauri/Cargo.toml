[package]
name = "overboom"
version = "0.13.1"
description = "OVERBOOM – 3D-Voxel-Arena-Roguelite mit Waffen-Fusion"
authors = ["OVERBOOM"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "overboom_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"

[profile.release]
# kleine, schnelle Binärdatei
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
