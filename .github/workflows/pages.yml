# Browser-Version auf GitHub Pages: https://hoai-droid.github.io/overBOOM/
# Jeder Push auf main veröffentlicht den aktuellen Web-Build (installierbar als Web-App, solo offline spielbar).
# Einmalig nötig: Repo → Settings → Pages → Source: „GitHub Actions“.
name: Browser-Version (GitHub Pages)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:web
      # Grafik-Testversion aus dem Zweig „grafik“ zusätzlich unter /grafik/ (falls vorhanden)
      - name: Grafik-Testversion bauen
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin grafik >/dev/null; then
            git clone --depth 1 --branch grafik "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" grafik-src
            (cd grafik-src && npm ci && npm run build:web)
            mkdir -p dist/grafik
            cp -r grafik-src/dist/. dist/grafik/
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
