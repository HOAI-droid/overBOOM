<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0814">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>OVERBOOM</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root { --cyan: #3de8ff; --orange: #ff7a1a; --yellow: #ffd23f; --magenta: #ff3df0; --red: #ff3d6a; --ink: #07040e; --panel: rgba(26, 18, 48, 0.88); }
  html, body { margin: 0; height: 100%; background: #0b0814; overflow: hidden; overscroll-behavior: none; }
  body { font-family: 'Silkscreen', monospace; color: #f4ecff; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #game { position: fixed; inset: 0; touch-action: none; }
  #game canvas { display: block; width: 100%; height: 100%; }
  .ob-hud { position: absolute; inset: 0; pointer-events: none; }
  .ob-hud button { pointer-events: auto; font-family: inherit; }
  .ob-left { position: absolute; left: max(14px, env(safe-area-inset-left)); top: max(12px, env(safe-area-inset-top)); display: flex; flex-direction: column; gap: 8px; }
  .ob-title { display: flex; align-items: baseline; gap: 2px; text-shadow: 0 3px 0 var(--ink); }
  .ob-title b { font-size: 22px; font-weight: 700; color: #f4ecff; }
  .ob-title b.boom { color: var(--yellow); text-shadow: 0 3px 0 #c2410c, 0 6px 0 var(--ink); }
  .ob-title span { margin-left: 10px; font-size: 10px; color: #c9bfe8; text-transform: uppercase; }
  .ob-top-right { position: absolute; right: max(14px, env(safe-area-inset-right)); top: max(12px, env(safe-area-inset-top)); display: flex; align-items: center; gap: 10px; }
  .ob-fps { font-size: 10px; color: #c9bfe8; text-shadow: 0 2px 0 var(--ink); }
  .ob-btn { width: 44px; height: 44px; border: 3px solid var(--ink); background: var(--panel); color: #f4ecff; font-size: 18px; box-shadow: 0 0 0 3px #3b2b66; cursor: pointer; }
  .ob-hp { position: relative; width: 168px; height: 18px; background: #2a1f45; border: 3px solid var(--ink); box-shadow: 0 0 0 2px #3b2b66; }
  .ob-hp-fill { position: absolute; inset: 0 auto 0 0; width: 100%; background: linear-gradient(#ff7a9a 0 30%, #ff3d6a 30% 75%, #c2284e 75%); transition: width 0.15s steps(6); }
  .ob-hp-fill.low { animation: ob-blink 0.5s steps(2) infinite; }
  .ob-hp-txt { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 10px; text-shadow: 0 2px 0 var(--ink); }
  .ob-gems { display: flex; align-items: center; gap: 6px; font-size: 16px; color: #a8f6ff; text-shadow: 0 2px 0 var(--ink); transform-origin: left center; }
  .ob-wave { position: absolute; left: 50%; top: max(10px, env(safe-area-inset-top)); transform: translateX(-50%); text-align: center; text-shadow: 0 3px 0 var(--ink); }
  .ob-wave-n { font-size: 11px; color: #c9bfe8; text-transform: uppercase; }
  .ob-wave-t { font-size: 26px; font-weight: 700; color: #f4ecff; }
  .ob-wave-t.urgent { color: var(--yellow); animation: ob-blink 0.5s steps(2) infinite; }
  .ob-toasts { position: absolute; z-index: 8; right: max(10px, env(safe-area-inset-right)); top: 64px; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; pointer-events: none; }
  .ob-toast { padding: 6px 10px; border: 3px solid var(--c); background: var(--panel); box-shadow: 0 0 0 2px var(--ink), 0 4px 0 var(--ink); max-width: 260px; }
  .ob-toast b { display: block; font-size: 10px; color: var(--c); text-transform: uppercase; }
  .ob-toast span { display: block; font-size: 13px; color: #f4ecff; }
  .ob-toast.glanz { background: linear-gradient(110deg, #2a1f45 30%, #5a3a8a 45%, #2a1f45 60%); background-size: 300% 100%; animation: ob-holo 1.2s linear infinite; }
  @keyframes ob-holo { from { background-position: 100% 0; } to { background-position: -100% 0; } }
  .ob-banner { position: absolute; z-index: 7; pointer-events: none; left: 50%; top: 34%; transform: translate(-50%, -50%); opacity: 0; text-align: center; white-space: nowrap; }
  .ob-banner b { display: block; font-size: clamp(28px, 7vw, 52px); font-weight: 700; text-transform: uppercase; color: var(--yellow); text-shadow: 0 4px 0 #c2410c, 0 8px 0 var(--ink); }
  .ob-banner b.cyan { color: var(--cyan); text-shadow: 0 4px 0 #1a6a8a, 0 8px 0 var(--ink); }
  .ob-banner b.rot { color: var(--red); text-shadow: 0 4px 0 #7a1030, 0 8px 0 var(--ink); }
  .ob-banner span { display: inline-block; padding: 3px 8px; background: var(--panel); margin-top: 6px; font-size: 12px; text-transform: uppercase; color: #f4ecff; text-shadow: 0 2px 0 var(--ink); }
  .ob-chain { position: absolute; left: 50%; top: 17%; opacity: 0; font-size: 26px; font-weight: 700; color: var(--magenta); white-space: nowrap; text-shadow: 0 3px 0 #6a1068, 0 6px 0 var(--ink); transform-origin: center; }
  .ob-hurt { position: absolute; inset: 0; opacity: 0; background: radial-gradient(ellipse at center, transparent 45%, rgba(255, 30, 70, 0.75)); }
  .ob-dmg-layer { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .ob-dmg { position: absolute; left: 0; top: 0; font-size: 13px; font-weight: 700; color: #fff; text-shadow: 2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 2px 0 var(--ink), 0 -2px 0 var(--ink); will-change: transform; }
  .ob-dmg.big { font-size: 16px; color: #ffe28a; }
  .ob-dmg.crit { font-size: 19px; color: var(--yellow); text-shadow: 2px 0 0 #c2410c, -2px 0 0 #c2410c, 0 2px 0 #c2410c, 0 -2px 0 #c2410c, 0 4px 0 var(--ink); }
  .ob-xp { display: flex; align-items: center; gap: 6px; }
  .ob-lvl { min-width: 40px; font-size: 11px; color: var(--yellow); text-shadow: 0 2px 0 var(--ink); }
  .ob-xp-bar { width: 122px; height: 8px; background: #2a1f45; border: 2px solid var(--ink); }
  .ob-xp-fill { width: 0; height: 100%; background: var(--yellow); transition: width 0.2s steps(4); }
  .ob-boss { margin-top: 6px; width: min(52vw, 360px); }
  .ob-boss.hidden { display: none; }
  .ob-boss span { display: block; font-size: 10px; color: var(--red); text-transform: uppercase; }
  .ob-boss-bar { height: 12px; margin-top: 3px; background: #2a1f45; border: 3px solid var(--ink); box-shadow: 0 0 0 2px #6a1030; }
  .ob-boss-fill { height: 100%; width: 100%; background: linear-gradient(#ff7a9a 0 30%, #ff3d6a 30% 75%, #c2284e 75%); transition: width 0.2s; }
  .ob-dmg.dodge { font-size: 11px; color: var(--cyan); }
  .ob-dmg.heal { font-size: 12px; color: #5dff7a; }
  .ob-dmg.lvl { font-size: 16px; color: var(--yellow); text-shadow: 2px 0 0 #c2410c, -2px 0 0 #c2410c, 0 2px 0 #c2410c, 0 -2px 0 #c2410c, 0 4px 0 var(--ink); }
  #game.in-menu .ob-dash, #game.in-menu .ob-hint, #game.in-menu .ob-chain { visibility: hidden; }

  /* Menüs: Startwahl, Level-Up, Shop, Ende, Pause */
  .ob-menu { position: absolute; inset: 0; z-index: 5; display: flex; align-items: flex-start; justify-content: center; overflow-y: auto; padding: max(14px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); box-sizing: border-box; background: rgba(11, 8, 20, 0.72); overscroll-behavior: contain; touch-action: pan-y;
    /* feste Kartengröße (Shop, Amboss, Ausrüstung, Level-Up, Startwahl) und Höhe des Waffendetails */
    --kw: 200px; --kh: 276px; --dh: 300px; }
  /* Kartenalbum */
  .ob-album .ob-subtabs { margin: 8px 0 10px; }
  .ob-album .ob-subtabs .ob-tab { min-height: 36px; padding: 0 10px; font-size: 12px; }
  .ob-shop.ob-album > .ob-sub { display: block; margin: 0 0 4px; }
  .ob-albumbtn { white-space: nowrap; }
  .ob-kgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
  .ob-kc { position: relative; aspect-ratio: 5 / 7; padding: 4px; border: 3px solid var(--rc); background: linear-gradient(170deg, color-mix(in srgb, var(--ec) 35%, #1c1434) 0%, #1c1434 70%); color: #f4ecff; display: flex; flex-direction: column; align-items: stretch; gap: 2px; box-shadow: 0 0 0 2px var(--ink); overflow: hidden; }
  .ob-kc-art { width: 100%; aspect-ratio: 1; image-rendering: pixelated; background: #140e24; border: 2px solid color-mix(in srgb, var(--ec) 60%, #140e24); box-sizing: border-box; }
  .ob-kc-nr { position: absolute; top: 6px; left: 7px; font-size: 8px; color: #c9bfe8; text-shadow: 0 1px 0 var(--ink); }
  .ob-kc-name { font-size: 9px; line-height: 1.2; text-align: center; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .ob-kc.locked { border-color: #3b2b66; background: #1c1434; color: #6b6188; }
  .ob-kc-neu { position: absolute; top: 4px; right: 4px; font-style: normal; font-size: 8px; padding: 1px 3px; background: var(--magenta, #ff3df0); color: var(--ink); text-transform: uppercase; }
  .ob-kc.glanz::after, .ob-bigcard.glanz .ob-holo { content: ''; position: absolute; inset: 0; pointer-events: none; mix-blend-mode: color-dodge;
    background: linear-gradient(115deg, transparent 25%, rgba(255,61,240,0.45) 38%, rgba(61,232,255,0.45) 50%, rgba(255,210,63,0.45) 62%, transparent 75%); background-size: 300% 300%; animation: ob-holo2 2.4s linear infinite; }
  @keyframes ob-holo2 { from { background-position: 100% 100%; } to { background-position: 0% 0%; } }
  .ob-kc.glanz::after { opacity: 0.45; }
  .ob-bigwrap { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; align-items: flex-start; }
  .ob-bigcard { --mx: 0.5; --my: 0.5; position: relative; width: min(330px, 100%); aspect-ratio: 5 / 7; box-sizing: border-box; padding: 10px; border: 8px solid var(--ec); background: #1c1434; box-shadow: 0 0 0 3px var(--ink), 8px 8px 0 var(--ink); display: flex; flex-direction: column; gap: 6px; overflow: hidden;
    transform: perspective(700px) rotateY(calc((var(--mx) - 0.5) * 14deg)) rotateX(calc((0.5 - var(--my)) * 10deg)); transition: transform 0.08s linear; }
  .ob-bigcard::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--rc); }
  .ob-bigcard.locked { border-color: #3b2b66; }
  .ob-bc-head { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
  .ob-bc-name { font-size: 15px; font-weight: 700; text-transform: uppercase; line-height: 1.1; }
  .ob-bc-wert { font-size: 8px; color: #c9bfe8; text-transform: uppercase; white-space: nowrap; }
  .ob-bc-wert b { font-size: 18px; color: var(--yellow); }
  .ob-bc-art { flex: 1 1 auto; min-height: 120px; display: flex; align-items: center; justify-content: center; background: linear-gradient(180deg, color-mix(in srgb, var(--ec) 30%, #2a1f45), #140e24); border: 2px solid var(--ec); }
  .ob-bc-art canvas { height: 100%; max-height: 190px; aspect-ratio: 1; image-rendering: pixelated; }
  .ob-bc-type { display: flex; justify-content: space-between; align-items: center; gap: 6px; padding: 2px 6px; background: #2a1f45; font-size: 8px; text-transform: uppercase; }
  .ob-bc-els { display: flex; gap: 2px; }
  .ob-bc-text { font-size: 9px; line-height: 1.4; color: #e8e2f0; }
  .ob-bc-text p { margin: 0 0 3px; }
  .ob-bc-text b { color: var(--yellow); text-transform: uppercase; }
  .ob-bc-flavor { color: #c9bfe8; font-style: italic; }
  .ob-bc-zitat { color: #9a94b0; }
  .ob-bc-lock { color: #8a80a8; }
  .ob-bc-foot { display: flex; justify-content: space-between; font-size: 8px; color: #c9bfe8; text-transform: uppercase; }
  .ob-bigcard.glanz .ob-holo { background-size: 250% 250%; background-position: calc(var(--mx) * 100%) calc(var(--my) * 100%); animation: none; opacity: 0.8; }
  .ob-bc-side { width: min(320px, 100%); display: flex; flex-direction: column; gap: 6px; }
  .ob-el { display: inline-block; vertical-align: middle; }
  .ob-erfolge { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 6px; }
  .ob-erfolge li { padding: 6px 8px; border: 2px solid #3b2b66; font-size: 9px; color: #8a80a8; display: flex; flex-direction: column; gap: 3px; }
  .ob-erfolge li.done { border-color: var(--yellow); color: #f4ecff; }
  .ob-erfolge li b { font-size: 11px; color: #c9bfe8; }
  .ob-erfolge li.done b { color: var(--yellow); }
  .ob-erf-bar { position: relative; height: 12px; background: #140e24; border: 1px solid #3b2b66; }
  .ob-erf-bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--cyan); }
  .ob-erf-bar small { position: relative; padding-left: 4px; font-size: 8px; color: #f4ecff; text-shadow: 0 1px 0 var(--ink); }
  .ob-erf-karte { color: #6b6188; }
  .ob-code { width: 100%; box-sizing: border-box; font-family: monospace; font-size: 10px; background: #140e24; color: #c9bfe8; border: 2px solid #3b2b66; padding: 6px; resize: vertical; }
  /* Titel, Lobby, Namensschilder (Koop) */
  .on-title .ob-hud { display: none; }
  .ob-titel { width: min(560px, 100%); display: flex; flex-direction: column; gap: 10px; }
  .ob-logo { margin: 4px 0 0; font-size: clamp(40px, 11vw, 76px); line-height: 1; text-align: center; letter-spacing: 2px; transform: rotate(-3deg); }
  .ob-logo b { color: #f4ecff; text-shadow: 0 5px 0 #6a3aa8, 0 10px 0 var(--ink); }
  .ob-logo b.boom { color: var(--orange, #ff7a1a); text-shadow: 0 5px 0 #c2410c, 0 10px 0 var(--ink); }
  .ob-titel .ob-sub { text-align: center; }
  .ob-titel-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; align-items: stretch; }
  .ob-big { min-height: 60px; font-size: 20px; padding: 0 28px; }
  .ob-field { display: flex; flex-direction: column; gap: 3px; font-size: 10px; color: #c9bfe8; text-transform: uppercase; }
  .ob-field input, .ob-codein { font-family: inherit; font-size: 16px; min-height: 44px; padding: 0 10px; background: #140e24; color: #f4ecff; border: 3px solid #3b2b66; box-sizing: border-box; }
  .ob-codein { width: 7.5em; text-align: center; text-transform: uppercase; letter-spacing: 3px; }
  .ob-field input:focus, .ob-codein:focus { outline: none; border-color: var(--yellow); }
  .ob-codein.ob-fehler { border-color: var(--red); animation: ob-wackeln 0.3s; }
  @keyframes ob-wackeln { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
  .ob-codehint { margin: -4px 0 0; min-height: 1.5em; font-size: 11px; line-height: 1.5; text-align: center; text-transform: uppercase; color: #c9bfe8; }
  .ob-lobby-top { display: grid; grid-template-columns: auto auto 1fr; gap: 12px; align-items: start; }
  @media (max-width: 640px) { .ob-lobby-top { grid-template-columns: 1fr 1fr; } .ob-lspieler { grid-column: 1 / -1; } }
  .ob-raum { display: flex; flex-direction: column; gap: 6px; }
  .ob-raum small { font-size: 9px; color: #c9bfe8; text-transform: uppercase; }
  .ob-code-big { font-size: 32px; font-weight: 700; letter-spacing: 5px; color: var(--yellow); text-shadow: 0 3px 0 var(--ink); }
  .ob-qr { width: 112px; height: 112px; background: #fff; padding: 4px; box-sizing: border-box; }
  .ob-qr svg { width: 100%; height: 100%; display: block; }
  .ob-lspieler { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  .ob-lspieler li { display: grid; grid-template-columns: 14px 1fr auto auto; gap: 2px 8px; align-items: center; padding: 5px 8px; border: 2px solid #3b2b66; font-size: 11px; }
  .ob-lspieler li.ich { border-color: var(--yellow); }
  .ob-lspieler li.leer { color: #6b6188; border-style: dashed; }
  .ob-lspieler i { width: 12px; height: 12px; background: var(--c); grid-row: span 2; }
  .ob-lspieler b { font-size: 12px; }
  .ob-lspieler span { color: #c9bfe8; font-size: 10px; }
  .ob-lspieler small { color: #7dff5a; font-size: 9px; grid-column: 2; }
  .ob-lspieler small.relay { color: var(--yellow); }
  .ob-lspieler em { font-style: normal; font-size: 9px; text-transform: uppercase; color: #8a80a8; grid-row: 1 / span 2; grid-column: 4; }
  .ob-lspieler em.ok { color: #7dff5a; }
  .ob-lhelden { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 6px; }
  .ob-lheld { min-height: 44px; padding: 4px 6px; border: 3px solid var(--rc); background: #1c1434; color: #f4ecff; display: flex; flex-direction: column; align-items: flex-start; gap: 1px; text-align: left; box-shadow: 0 0 0 2px var(--ink); }
  .ob-lheld b { font-size: 11px; }
  .ob-lheld small { font-size: 8px; color: #c9bfe8; }
  .ob-lheld.on { background: var(--rc); color: var(--ink); }
  .ob-lheld.on small { color: var(--ink); }
  .ob-lheld:disabled { opacity: 0.45; border-color: #3b2b66; }
  .ob-card.ob-locked { opacity: 0.55; filter: grayscale(0.8); }
  .ob-tags-layer { position: absolute; inset: 0; pointer-events: none; z-index: 4; overflow: hidden; }
  .ob-nametag { position: absolute; left: 0; top: 0; display: flex; flex-direction: column; align-items: center; font-size: 10px; text-transform: uppercase; white-space: nowrap; }
  .ob-nametag .n { padding: 1px 5px; background: var(--panel); color: var(--c); border: 2px solid var(--c); box-shadow: 0 2px 0 var(--ink); }
  .ob-nametag .i { color: #ff3d6a; font-size: 9px; text-shadow: 0 1px 0 var(--ink); }
  .ob-nametag.down .n { animation: ob-blink 0.6s steps(2) infinite; }
  .ob-nametag .ob-pfeil { display: none; width: 0; height: 0; border: 7px solid transparent; border-left: 12px solid var(--c); transform: rotate(var(--a)); margin-bottom: 2px; }
  .ob-nametag.off .ob-pfeil { display: block; }
  /* Einstellungen */
  .ob-setgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; }
  .ob-set { display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto auto; gap: 4px 10px; align-items: center; padding: 8px 10px; min-height: 44px; border: 2px solid #3b2b66; background: #1c1434; color: #f4ecff; font-size: 12px; text-align: left; box-sizing: border-box; }
  .ob-set span { display: flex; flex-direction: column; gap: 2px; }
  .ob-set small { font-size: 9px; color: #8a80a8; }
  .ob-set input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--yellow); height: 24px; }
  .ob-set b { color: var(--yellow); font-size: 12px; grid-row: 1; grid-column: 2; }
  .ob-toggle b { color: #8a80a8; }
  .ob-toggle.on { border-color: var(--yellow); }
  .ob-toggle.on b { color: var(--yellow); }
  .ob-gefahr { display: flex; flex-direction: column; gap: 3px; padding: 6px 8px; border: 2px solid color-mix(in srgb, #ff3d3d calc(var(--g) * 10%), #3b2b66); background: #140e24; }
  .ob-gefahr-row { display: flex; align-items: center; gap: 8px; }
  .ob-gefahr-row b { flex: 1; text-align: center; font-size: 13px; color: color-mix(in srgb, #ff3d3d calc(var(--g) * 10%), #ffd23f); }
  .ob-gefahr-row .ob-btn2 { min-width: 44px; min-height: 36px; padding: 0; font-size: 18px; }
  .ob-gefahr small { font-size: 9px; color: #c9bfe8; line-height: 1.4; }
  /* Overkill-Leiste und OVERBOOM-Modus */
  .ob-ok { display: flex; align-items: center; gap: 6px; font-size: 8px; text-transform: uppercase; color: #ff7a1a; margin-top: 3px; }
  .ob-ok-bar { flex: 1; height: 6px; background: #2a1f45; box-shadow: 0 0 0 2px var(--ink); max-width: 150px; }
  .ob-ok-fill { height: 100%; width: 0; background: linear-gradient(90deg, #ff7a1a, #ffd23f); transition: width 0.15s; }
  .ok-voll .ob-ok-fill { animation: ob-blink 0.4s steps(2) infinite; }
  .ok-aktiv .ob-ok-fill { background: linear-gradient(90deg, #ff3df0, #ff7a1a, #ffd23f); }
  .ob-boombtn { position: absolute; right: max(140px, calc(env(safe-area-inset-right) + 140px)); bottom: max(34px, env(safe-area-inset-bottom)); display: none; flex-direction: column; align-items: center; padding: 8px 12px; border: 3px solid var(--ink); background: #ff7a1a; color: var(--ink); font-family: inherit; font-size: 12px; font-weight: 700; box-shadow: 0 5px 0 #c2410c, 0 0 18px rgba(255,122,26,0.7); cursor: pointer; touch-action: none; animation: ob-pulse 0.6s ease-in-out infinite alternate; }
  .ob-boombtn b { font-size: 16px; }
  .ob-boombtn small { font-size: 8px; font-weight: 400; }
  .ok-voll .ob-boombtn { display: flex; }
  #game.in-menu .ob-boombtn { display: none; }
